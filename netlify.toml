[build]
  command = "node scripts/build.mjs"
  publish = "public"

[functions]
  node_bundler = "esbuild"

# Gradient API: sharp ships native binaries, so keep it out of the bundle and ship them alongside
# (scoped to this one function so the access functions stay small).
[functions."gradient-api"]
  external_node_modules = ["sharp"]
  included_files = ["node_modules/@img/sharp-linux-x64/**", "node_modules/@img/sharp-libvips-linux-x64/**"]

[[redirects]]
  from = "/tools/gradient-generator"
  to = "/locked/tools/gradient-generator/"
  status = 301

[[redirects]]
  from = "/tools/gradient-generator/*"
  to = "/locked/tools/gradient-generator/:splat"
  status = 301

# Locked files are guarded by netlify/edge-functions/locked-gate.js.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"
